# Publishes the frontend mockup to GitHub Pages.
# It runs on the in-browser sample data: no backend, no real payments.
name: Deploy mockup to GitHub Pages

# Manual only: the mockup is hosted on Vercel. Run this from the Actions tab
# if you switch Pages on and want a GitHub-hosted copy too.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, contrast, tests
        run: npm run lint && npm run check:contrast && npm test
      - name: Build for Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no SPA fallback: serve the app for any unknown path.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
